[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "isaaclab_ipc"
version = "0.1.0"
description = "IPC navigation with native Newton physics and batched GPU MPC."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["isaaclab[rsl-rl]==3.0.0", "numpy>=2", "scipy>=1.14", "osqp==1.0.5", "pybind11>=3", "pyyaml>=6.0"]

[project.entry-points."isaaclab.tasks"]
isaaclab_ipc = "isaaclab_ipc.tasks"

[project.optional-dependencies]
recording = [
    "rerun-sdk==0.38.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
  "numpy>=2", "mujoco~=3.12.0", "mujoco-warp~=3.12.0", "newton[sim]==1.6.1",
  "newton-usd-schemas>=0.5.0", "usd-exchange==3.0.1", "usd-optimize~=1.3.1",
  "torch==2.11.0", "torchvision==0.26.0", "fsspec>=2026.6.0",
  "packaging>=20,<27", "urllib3>=2.8.0",
]

[tool.uv.sources]
isaaclab = { index = "nvidia" }
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv.build-backend]
module-name = "isaaclab_ipc"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/isaaclab_ipc/collision.py" = ["UP018"]
"src/isaaclab_ipc/sensing.py" = ["UP018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: launches Isaac Sim"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = false

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
